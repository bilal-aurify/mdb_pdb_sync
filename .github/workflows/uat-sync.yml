name: UAT Database Sync

on:
  schedule:
    # GitHub Actions cron schedules use UTC.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONGO_URI_UAT: ${{ secrets.MONGO_URI_UAT }}
      MONGO_DB_UAT: ${{ secrets.MONGO_DB_UAT }}
      PG_HOST_UAT: ${{ secrets.PG_HOST_UAT }}
      PG_PORT_UAT: ${{ secrets.PG_PORT_UAT }}
      PG_DATABASE_UAT: ${{ secrets.PG_DATABASE_UAT }}
      PG_USER_UAT: ${{ secrets.PG_USER_UAT }}
      PG_PASSWORD_UAT: ${{ secrets.PG_PASSWORD_UAT }}
      INITIAL_RUN_UAT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run configured database sync
        run: python runner.py
